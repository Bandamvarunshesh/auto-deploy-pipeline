name: CI-CD

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  test-build-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps + test
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt pytest
          pytest -q

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push image
        id: meta
        run: |
          IMAGE="ghcr.io/${{ github.repository }}:sha-${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

  deploy:
    runs-on: ubuntu-latest
    needs: test-build-push
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      
      - name: Setup kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config

      - name: Deploy (update image)
        run: |
          IMAGE="${{ needs.test-build-push.outputs.image }}"
          kubectl apply -f k8s/
          kubectl set image deployment/auto-deploy auto-deploy="$IMAGE"
          kubectl rollout status deployment/auto-deploy --timeout=120s

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed. Rolling back..."
          kubectl rollout undo deployment/auto-deploy
          kubectl rollout status deployment/auto-deploy --timeout=120s
